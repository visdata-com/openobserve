# 静态密码 (测试用，生产环境请禁用)
staticPasswords:
  - email: "admin@example.com"
    # 密码: password (bcrypt hash)
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "admin"
    userID: "admin-user-id"

# 日志配置
logger:
  level: "info"
  format: "json"

# Token 过期时间
expiry:
  signingKeys: "6h"
  idTokens: "24h"
  refreshTokens:
    validIfNotUsedFor: "168h"  # 7 days
    absoluteLifetime: "720h"   # 30 days