# Dex 服务配置
issuer: http://localhost:5556

# 存储后端
storage:
  type: postgres
  config:
    host: postgres
    port: 5432
    database: dex
    user: dex
    password: dex
    ssl:
      mode: disable

# Web 服务配置
web:
  http: 0.0.0.0:5556
  # 生产环境启用 HTTPS
  # https: 0.0.0.0:5556
  # tlsCert: /etc/dex/tls/tls.crt
  # tlsKey: /etc/dex/tls/tls.key

# gRPC API (用于管理)
grpc:
  addr: 0.0.0.0:5557
  # 生产环境启用 TLS
  # tlsCert: /etc/dex/tls/tls.crt
  # tlsKey: /etc/dex/tls/tls.key
  reflection: true

# OAuth2 配置
oauth2:
  skipApprovalScreen: true
  alwaysShowLoginScreen: false

# 静态客户端 (OpenObserve)
staticClients:
  - id: openobserve
    name: 'OpenObserve'
    secret: your-super-secret-key-change-me
    redirectURIs:
      - 'http://localhost:5080/auth/callback'
      - 'http://localhost:5080/web/cb'
    # 可选：启用 PKCE
    public: false

# 启用密码登录 (用于本地用户)
enablePasswordDB: true

