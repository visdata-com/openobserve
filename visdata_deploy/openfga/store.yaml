# OpenFGA Store 配置文件
# 可用于 fga store import 命令一次性导入模型和数据
#
# 使用方法:
#   fga store import --file store.yaml
#
# 或分步执行:
#   1. fga store create --name openobserve
#   2. fga model write --store-id <STORE_ID> --file model.fga
#   3. fga tuple write --store-id <STORE_ID> --file tuples.yaml

